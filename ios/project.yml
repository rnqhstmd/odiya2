name: Odiya
options:
  bundleIdPrefix: com.bonseung
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  KakaoSDK:
    url: https://github.com/kakao/kakao-ios-sdk.git
    from: "2.22.0"

targets:
  Odiya:
    type: application
    platform: iOS
    sources:
      - path: Odiya
        excludes:
          - "**/OdiyaTests/**"
    resources:
      - path: Odiya/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bonseung.odiya
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Odiya/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: KakaoSDK
        product: KakaoSDK

  OdiyaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OdiyaTests
    dependencies:
      - target: Odiya
