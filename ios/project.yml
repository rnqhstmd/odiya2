name: Odiya
options:
  bundleIdPrefix: com.loopers
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.3"
  groupSortPosition: none

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

packages:
  KakaoSDK:
    url: https://github.com/kakao/kakao-ios-sdk.git
    from: "2.22.0"

targets:
  Odiya:
    type: application
    platform: iOS
    sources:
      - path: Odiya
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        INFOPLIST_FILE: Odiya/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.loopers.Odiya
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: KakaoSDK
        product: KakaoSDK

  OdiyaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OdiyaTests
    dependencies:
      - target: Odiya

  OdiyaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OdiyaUITests
    dependencies:
      - target: Odiya
